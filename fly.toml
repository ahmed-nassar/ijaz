# Fly.io config for the whole project: one app, `ijaz`, at https://ijaz.fly.dev
# Deploy from the repository root with:  fly deploy
#
# Process groups (all from the same image, see Dockerfile):
#   web     the website and its read API. Two machines: one always stays on, the
#           second starts when traffic needs it and stops again when it is quiet.
#   worker  polls the feeds, then runs the story step (grouping, headlines, ranking,
#           homepage snapshot); see README. One machine, always on, no web traffic.
#           It restarts on its own if it crashes. The database lease still prevents
#           double polling if a second worker is ever added.
# Machine counts: fly scale count web=2 worker=1 -a ijaz (deploys keep them).
#
# Secrets (set with `fly secrets set -a ijaz`, never in this file):
#   DATABASE_URL          Neon connection string (direct endpoint, not -pooler)
#   COLLECTOR_USER_AGENT  e.g. "SiteName/0.1 (+https://site.example/about-our-crawler)"
#   IJAZ_OPENROUTER_KEY   OpenRouter key for the story work (spec section 15)

app = "ijaz"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "sh ./start-web.sh"
  worker = "collector -v run"

[env]
  # Worker only: poll in 20-minute rounds so Neon's compute can scale to zero
  # between them. The website ignores it.
  COLLECTOR_ROUND_MINUTES = "20"

[deploy]
  # Runs once per deploy in a temporary machine, before any machine is replaced.
  # Both steps are idempotent: tables and indexes are created if missing, sources are upserted.
  release_command = "sh -c 'collector init-db && collector load-sources sources/sources.yaml'"

[http_service]
  processes = ["web"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1  # one web machine stays on when idle
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[restart]]
  policy = "always"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "worker"]
