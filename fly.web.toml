# Fly.io config for the website (River page + read API): https://ijaz.fly.dev
# Deploy from the repository root with:  fly deploy -c fly.web.toml
# Secret (set with `fly secrets set -a ijaz`, never in this file):
#   DATABASE_URL  the same Neon connection string the collector uses
#
# The machine stops when nobody has visited for a few minutes and starts again on the
# next visit (a few seconds' delay), so neither it nor Neon runs while the site is idle.

app = "ijaz"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
