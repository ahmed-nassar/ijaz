[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "collector"
version = "0.1.0"
description = "News collector: source registry, feed poller, header-only page check and clean-up"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "sqlalchemy>=2.1.9",
    "psycopg[binary]>=3.3.9",
    "pyyaml>=6.0.3",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "numpy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]
# httpx (already a dependency) drives fastapi.testclient in the API tests.

[project.scripts]
collector = "collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
